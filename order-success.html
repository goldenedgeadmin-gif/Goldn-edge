<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Placed — Golden Edge</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
  .success-wrap{max-width:480px;margin:36px auto;padding:0 16px;text-align:center;}
  .success-icon{
    width:72px;height:72px;border-radius:50%;background:#e1f5e8;color:var(--green);
    display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 16px;
  }
  .success-wrap h2{margin:0 0 6px;}
  .success-wrap .sub{color:var(--slate);font-size:.9rem;margin-bottom:24px;}
  .order-ref{
    background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 18px;margin-bottom:22px;font-family:'JetBrains Mono',monospace;font-size:.9rem;color:var(--navy);
  }
  .whatsapp-wide-btn{
    display:flex;align-items:center;justify-content:center;gap:12px;
    width:100%;background:#25D366;color:#fff;border:none;border-radius:16px;
    padding:18px 20px;font-family:'Baloo 2';font-size:1.05rem;font-weight:700;
    box-shadow:0 10px 24px rgba(37,211,102,0.35);cursor:pointer;text-decoration:none;
  }
  .whatsapp-wide-btn:hover{filter:brightness(1.04);}
  .whatsapp-wide-btn svg{width:30px;height:30px;flex-shrink:0;}
  .success-note{color:var(--slate);font-size:.82rem;margin-top:14px;}
  .success-links{margin-top:26px;display:flex;flex-direction:column;gap:10px;}
</style>
</head>
<body>

<div id="splashScreen" class="splash-screen">
  <img src="assets/loading.png" alt="Golden Edge — Fast delivery, easy shopping">
  <div class="splash-spinner"></div>
  <div class="splash-text">Golden Edge</div>
</div>

<div id="site-header"></div>

<main class="success-wrap">
  <div class="success-icon">✓</div>
  <h2>Order placed successfully!</h2>
  <p class="sub" id="success-sub">Thank you for shopping with Golden Edge.</p>

  <div class="order-ref" id="order-ref"></div>

  <a href="#" id="whatsapp-order-btn" class="whatsapp-wide-btn" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 32 32"><path fill="#fff" d="M16.001 3C9.373 3 4 8.373 4 15c0 2.386.703 4.607 1.912 6.472L4 29l7.72-1.877A11.94 11.94 0 0 0 16.001 27C22.629 27 28 21.627 28 15S22.629 3 16.001 3zm0 21.818c-1.94 0-3.744-.57-5.26-1.55l-.377-.24-4.583 1.114 1.128-4.47-.246-.394A9.77 9.77 0 0 1 5.182 15c0-5.964 4.855-10.818 10.819-10.818S26.818 9.036 26.818 15 21.965 24.818 16.001 24.818zm5.98-8.132c-.328-.164-1.94-.957-2.241-1.066-.301-.11-.52-.164-.739.164-.219.328-.848 1.066-1.04 1.285-.191.219-.383.246-.71.082-.328-.164-1.386-.51-2.64-1.63-.976-.87-1.635-1.946-1.827-2.274-.191-.328-.02-.505.144-.668.148-.147.328-.383.492-.574.164-.191.219-.328.328-.547.11-.219.055-.41-.027-.574-.082-.164-.739-1.782-1.013-2.44-.267-.64-.539-.553-.739-.563l-.63-.011a1.21 1.21 0 0 0-.876.41c-.301.328-1.15 1.124-1.15 2.741 0 1.617 1.177 3.18 1.341 3.399.164.219 2.318 3.54 5.617 4.964.785.339 1.397.541 1.874.692.787.25 1.503.215 2.07.13.631-.094 1.94-.793 2.213-1.559.273-.766.273-1.422.191-1.559-.082-.137-.301-.219-.629-.383z"/></svg>
    <span>Send my order details on WhatsApp</span>
  </a>
  <p class="success-note">This opens WhatsApp with your order details already filled in — just hit send so we can confirm and start processing it.</p>

  <div class="success-links">
    <a href="orders.html" class="btn btn-outline btn-block">View my orders</a>
    <a href="products.html" class="btn btn-outline btn-block">Continue shopping</a>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/countries.js"></script>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  const orderId = new URLSearchParams(window.location.search).get("order");
  const order = orderId ? DB.getOrder(orderId) : null;

  if (!order) {
    // No valid order to show — send them somewhere useful instead of a
    // blank confirmation page.
    window.location.href = "orders.html";
  } else {
    document.getElementById("order-ref").textContent = `Order ID: ${order.id}`;
    document.getElementById("success-sub").textContent = `Thanks, ${order.customerName.split(" ")[0]}! Your payment of ${formatMoney(order.total)} was received.`;
    document.getElementById("whatsapp-order-btn").href = buildOrderWhatsAppLink(order);
  }
</script>
</body>
</html>
